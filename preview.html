<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>할 일 목록</title>
</head>
<body>
  <h1>할 일 목록</h1>
  <ul id="todo-list"></ul>
  <p id="status"></p>
  <a href="index.html">홈으로</a>

  <script>
    const SUPABASE_URL = "https://gxyoflteqnnocwreufbt.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_JDjdJyxoulVgi8MkGZMvXA_EJrm9eP9";

    async function loadTodos() {
      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("todo-list");

      try {
        const res = await fetch(`${SUPABASE_URL}test_todos?select=*`, {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
          },
        });

        if (!res.ok) {
          throw new Error(`요청 실패: ${res.status} ${res.statusText}`);
        }

        const todos = await res.json();

        if (todos.length === 0) {
          statusEl.textContent = "데이터가 없습니다.";
          return;
        }

        const escapeHtml = (value) =>
          String(value).replace(
            /[&<>"']/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
          );

        const labelMap = {
          id: "번호",
          title: "할 일",
          task: "할 일",
          content: "내용",
          description: "설명",
          completed: "완료 여부",
          done: "완료 여부",
          is_done: "완료 여부",
          created_at: "생성일",
          updated_at: "수정일",
        };

        const formatValue = (key, value) => {
          if (typeof value === "boolean") return value ? "완료" : "미완료";
          if (value === null) return "없음";
          if (/(_at|date)$/i.test(key) && !Number.isNaN(Date.parse(value))) {
            return new Date(value).toLocaleString("ko-KR");
          }
          return String(value);
        };

        listEl.innerHTML = todos
          .map((todo) => {
            const fields = Object.entries(todo)
              .map(([key, value]) => {
                const label = labelMap[key] || key;
                return `<li><strong>${escapeHtml(label)}</strong>: ${escapeHtml(formatValue(key, value))}</li>`;
              })
              .join("");
            return `<li><ul>${fields}</ul></li>`;
          })
          .join("");
      } catch (err) {
        statusEl.textContent = `오류: ${err.message}`;
      }
    }

    loadTodos();
  </script>
</body>
</html>
